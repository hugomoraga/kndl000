{%- assign _sym = include.symbol | default: page.symbol -%}
{%- assign _sigil = include.sigil | default: page.sigil | default: "default" -%}
{% unless page.url == "/" %}
    <h1 class="page-title" aria-label="{{ page.title | escape }}">
      <span class="page-title__text">
        {%- if _sym -%}
          <span class="sigil sigil--{{ _sigil }}" aria-hidden="true"><span class="sigil__glyph">{{ _sym }}</span></span>
        {%- endif -%}
        {{ page.title }}
      </span>
      <span class="init">
        <a href="{{ site.baseurl }}/" aria-label="Inicio">∅ INIT</a>
      </span>
    </h1>
{% endunless %}
