# Configuración de la página de inicio (/)
# Ajusta números aquí sin tocar JS ni Liquid salvo casos nuevos.

collage:
  # Si false, no se muestra el mini collage
  enabled: true
  # Cuántas imágenes mostrar en cada sorteo
  max_items: 6
  # true = aleatorio desde la colección Imaginario (site.images); false = lista manual en assemblage.yml
  dynamic: true

lab:
  # Cuántas tarjetas "ARCHIVO_xx" se muestran en cada sorteo
  sample_count: 10
  # Cuántos poemas/reportes entran al JSON del laboratorio (pool para el shuffle)
  poems_pool_limit: 50
  melange_pool_limit: 50
