# Tipos de anexo. Son operaciones, no categorías cerradas.
- id: correccion
  label: "Corrección"
  order: 1
  description: "Una afirmación que se rectificó: qué decía, qué se corrigió y con qué fuente."
- id: fuente
  label: "Fuente"
  order: 2
  description: "Un documento o conjunto de documentos examinados: qué dice, qué no dice y cómo se verificó."
- id: concepto
  label: "Concepto"
  order: 3
  description: "Una idea o teoría que se expande; puede ser provisional y no corrige nada."
- id: objecion
  label: "Objeción"
  order: 4
  description: "Un caso o contraejemplo que resiste la tesis; no se resuelve, se sostiene."
- id: derivacion
  label: "Derivación"
  order: 5
  description: "Un desarrollo formal o ejecutable: pasos, supuestos y límites."
