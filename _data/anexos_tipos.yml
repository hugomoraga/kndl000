# Tipos de anexo. Son operaciones, no categorías de tema.
# Un anexo declara un solo tipo primario. Ver docs/rizoma/taxonomia-anexos.md.
- id: correccion
  label: "Corrección"
  order: 1
  question: "¿Qué afirmamos mal y qué lo corrige?"
- id: fuente
  label: "Fuente"
  order: 2
  question: "¿Qué dice esta fuente, qué no dice y cómo lo verificamos?"
- id: concepto
  label: "Concepto"
  order: 3
  question: "¿Qué idea expandimos y cómo se relaciona?"
- id: objecion
  label: "Objeción"
  order: 4
  question: "¿Qué caso resiste la tesis y por qué no se resuelve?"
- id: derivacion
  label: "Derivación"
  order: 5
  question: "¿Qué se sigue de estos supuestos y con qué límites?"
