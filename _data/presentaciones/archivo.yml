# Presentación editorial de 02. Todo es opcional: si falta, el generador
# deriva el mapa de los encabezados y deja el aparato cerrado.

mapa:
  - seccion: dos-rastros
    etiqueta: "Dos rastros"
    movimiento: "origen"
  - seccion: guardar
    etiqueta: "Guardar"
    movimiento: "soporte"
  - seccion: recuperar
    etiqueta: "Recuperar"
    movimiento: "lectura"
  - seccion: transformar
    etiqueta: "Transformar"
    movimiento: "pérdida"
  - seccion: deprecar
    etiqueta: "Deprecar"
    movimiento: "futuro"
  - seccion: repetir-para-no-perderse
    etiqueta: "Repetir"
    movimiento: "redundancia"
  - seccion: adherir
    etiqueta: "Adherir"
    movimiento: "cuerpo"
  - seccion: preguntas-abiertas
    etiqueta: "Preguntas"
    movimiento: "deudas"

respiros:
  - antes_de: guardar
    texto: "No sé si esto lo escribí para mí, para ella, o para el olvido."
    fuente: /fragmentos/
  - antes_de: deprecar
    texto: "El servidor no responde."
    fuente: /vestigios/pagina-que-ya-no-responde/
  - antes_de: adherir
    texto: "lleno de residuos / que no son míos / pero se quedan."
    fuente: /poemas/medusa/

diagrama:
  tipo: regimenes
  titulo: "Archivo y residuo"
  antes_de: dos-rastros
  izquierda:
    etiqueta: "Archivo"
    nota: "conserva por repetición"
    obras:
      - /dispositivos/candil/
      - /codigo/grid-palabras/
  derecha:
    etiqueta: "Residuo"
    nota: "conserva por adherencia"
    obras:
      - /poemas/medusa/
      - /vestigios/pagina-que-ya-no-responde/
  corte: "Deprecación"
  blanco: "Lo que no se puede clasificar"

aparato: cerrado
