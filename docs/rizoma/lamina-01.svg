<a href="/rizoma/" aria-label="Rizoma"><text x="44" y="56" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.12em">KNDL · RIZOMA / LÁMINA 01</text></a><text x="1236" y="56" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.12em">2026-11-10 · ABIERTA</text><a href="/rizoma/que-se-conserva-cuando-algo-se-repite/" aria-label="Volver a la exploración"><text x="44" y="112" font-size="44" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" font-weight="300">¿Qué se conserva cuando algo se</text><text x="44" y="156" font-size="44" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" font-weight="300">repite?</text></a><text x="44" y="196" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">ESTADO DEL CAMPO AL 2026-11-10. NO ES UN RESUMEN.</text><line x1="44" y1="224" x2="1236" y2="224" stroke="#e9e6dc" stroke-width="1" stroke-opacity="0.14"/><a href="/poemas/persistencias-del-algo/" aria-label="Persistir en el algo"><text x="40" y="276" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="11">⁂</tspan><tspan dx="6">POEMA · SERIE</tspan></text><text x="40" y="300" font-size="17" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif">Persistir en el algo</text><text x="40" y="318" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">UNA CONSTANTE EN MI SER</text><text x="40" y="342" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">Camino con las palabras</text><text x="40" y="362" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">o me enredaré en ellas.</text></a><a href="/poemas/cae/" aria-label="∞"><text x="40" y="484" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="11">⁂</tspan><tspan dx="6">POEMA</tspan></text><text x="40" y="508" font-size="24" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif">∞</text><text x="40" y="526" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">CAE</text><text x="40" y="550" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">No hay palabras que</text><text x="40" y="570" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">puedan retratarlo.</text></a><a href="/fragmentos/" aria-label="Rastros"><text x="360" y="276" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="11">⟡</tspan><tspan dx="6">RASTRO · FRAGMENTO</tspan></text><text x="360" y="300" font-size="17" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif">Rastros</text><text x="360" y="318" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">2026-06-15</text><text x="360" y="342" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">El alfabeto se gasta al repetirlo.</text><text x="360" y="362" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">Las palabras también.</text></a><a href="/codigo/espiral-fibonacci/" aria-label="Espiral de Fibonacci"><text x="704" y="284" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="11">◊</tspan><tspan dx="6">CÓDIGO</tspan></text><text x="704" y="308" font-size="17" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif">Espiral de Fibonacci</text><text x="704" y="326" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">RECURRENCIA</text><text x="704" y="350" font-size="11.5" fill="#9aa3a1" font-family="'JetBrains Mono', ui-monospace, monospace">a(n) = a(n−1) + a(n−2)</text></a><a href="/dispositivos/espiral/" aria-label="Espiral"><text x="1000" y="284" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="11">⎔</tspan><tspan dx="6">DISPOSITIVO</tspan></text><text x="1000" y="308" font-size="17" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif">Espiral</text><text x="1000" y="326" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">V0.1.1</text><text x="1000" y="350" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">Siete canales, patrones de</text><text x="1000" y="370" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">16 pasos, semilla</text><text x="1000" y="390" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">reproducible.</text></a><a href="/codigo/experimento-shannon/" aria-label="Experimento de Shannon"><text x="896" y="528" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="11">◊</tspan><tspan dx="6">CÓDIGO</tspan></text><text x="896" y="552" font-size="17" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif">Experimento de Shannon</text><text x="896" y="570" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">APROXIMACIONES AL LENGUAJE</text><text x="896" y="594" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">Del caos a la estructura.</text></a><a href="/codigo/hormiga-langton/" aria-label="Hormiga de Langton"><text x="588" y="716" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="11">◊</tspan><tspan dx="6">CÓDIGO</tspan></text><text x="588" y="740" font-size="17" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif">Hormiga de Langton</text><text x="588" y="758" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">DOS REGLAS</text><text x="588" y="782" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">El caos que emerge del orden.</text><text x="588" y="802" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">El orden que emerge del caos.</text></a><a href="/rizoma/nodos/#persistencia" aria-label="nodo persistencia"><text x="52" y="444" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>persistencia</text></a><a href="/rizoma/nodos/#repeticion" aria-label="nodo repetición"><text x="52" y="620" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>repetición<tspan font-size="8" dy="-4" fill="#7f8a88">02</tspan></text></a><a href="/rizoma/nodos/#desgaste" aria-label="nodo desgaste"><text x="360" y="412" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>desgaste</text></a><a href="/rizoma/nodos/#diferencia" aria-label="nodo diferencia"><text x="616" y="440" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>diferencia</text></a><a href="/rizoma/nodos/#recurrencia" aria-label="nodo recurrencia"><text x="704" y="412" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>recurrencia</text></a><a href="/rizoma/nodos/#automatizacion" aria-label="nodo automatización"><text x="1000" y="476" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>automatización<tspan font-size="8" dy="-4" fill="#7f8a88">02</tspan></text></a><a href="/rizoma/nodos/#memoria" aria-label="nodo memoria"><text x="780" y="464" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>memoria<tspan font-size="8" dy="-4" fill="#7f8a88">02</tspan></text></a><a href="/rizoma/nodos/#archivo" aria-label="nodo archivo"><text x="476" y="672" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>archivo<tspan font-size="8" dy="-4" fill="#7f8a88">02</tspan></text></a><a href="/rizoma/nodos/#redundancia" aria-label="nodo redundancia"><text x="924" y="676" font-size="10.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="#e9e6dc" fill-opacity="0.30">— </tspan>redundancia<tspan font-size="8" dy="-4" fill="#7f8a88">02</tspan></text></a><text x="360" y="540" font-size="10" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.12em">CORTE</text><line x1="360" y1="560" x2="544" y2="560" stroke="#e9e6dc" stroke-width="1" stroke-opacity="0.34"/><line x1="676" y1="560" x2="872" y2="560" stroke="#e9e6dc" stroke-width="1" stroke-opacity="0.34"/><text x="544" y="592" font-size="15" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" font-style="italic">un ritual no es una costumbre:</text><text x="544" y="612" font-size="15" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" font-style="italic">es una máquina de producir presente</text><rect x="40" y="672" width="268" height="172" fill="none" stroke="#e9e6dc" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.16"/><text x="60" y="700" font-size="10" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.12em">SIN TRAZO</text><text x="60" y="748" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">¿qué repite una memoria</text><text x="60" y="768" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">que no guarda nada?</text><line x1="924" y1="788" x2="960" y2="788" stroke="#e9e6dc" stroke-width="1" stroke-opacity="0.14"/><text x="924" y="812" font-size="13" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">La pregunta no se movió. Se movió</text><text x="924" y="832" font-size="13" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">lo que podía responderla.</text><line x1="44" y1="984" x2="1236" y2="984" stroke="#e9e6dc" stroke-width="1" stroke-opacity="0.14"/><text x="44" y="1008" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.05em">Proximidad, no causalidad. La lectura es de quien cartografía.</text><text x="520" y="1008" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.05em">02 = también en la segunda deriva.</text><text x="1236" y="1008" font-size="9.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.05em">La lámina se fecha y se rehace.</text>    </svg>
