# Anotación editorial de la lámina 01. El esqueleto (obras, nodos, kinds,
# compartidos, fechas) vive en lamina-01.data.yml y se regenera con --sync.
# Acá quedan las decisiones que no se deducen de los datos: posiciones,
# citas, corte, blanco y colofón.

