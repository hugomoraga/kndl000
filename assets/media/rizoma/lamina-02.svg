pace, monospace">DNS_PROBE_FINISHED_NXDOMAIN</text></a><a class="node" href="/rizoma/nodos/#soporte" aria-label="nodo soporte"><text x="360" y="398" font-size="11.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="rgba(233,230,220,0.30)">— </tspan>soporte</text></a><a class="node" href="/rizoma/nodos/#residuo" aria-label="nodo residuo"><text x="360" y="415" font-size="11.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="rgba(233,230,220,0.30)">— </tspan>residuo</text></a></g><g class="work-block"><a href="/vestigios/pagina-doblada-en-cuatro/" aria-label="Página doblada en cuatro"><text x="704" y="276" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="12">⏚</tspan><tspan dx="6">VESTIGIO</tspan></text><text x="704" y="300" font-size="18" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" class="work-title">Página doblada en cuatro</text><text x="704" y="319" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">2026-06-15</text><text x="704" y="344" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">La tinta no se acuerda de mí.</text><text x="704" y="365" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">Cuaderno pautado, tinta azul.</text></a></g><g class="work-block"><a href="/dispositivos/candil/" aria-label="Candil"><text x="1000" y="276" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="12">⎔</tspan><tspan dx="6">DISPOSITIVO</tspan></text><text x="1000" y="300" font-size="18" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" class="work-title">Candil</text><text x="1000" y="319" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">LECTOR · EPUB</text><text x="1000" y="344" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">La biblioteca indexa sin copiar;</text><text x="1000" y="365" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">el progreso y las notas</text><text x="1000" y="386" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">quedan en disco.</text></a></g><g class="work-block"><a href="/poemas/medusa/" aria-label="Medusa"><text x="40" y="540" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="12">⁂</tspan><tspan dx="6">POEMA</tspan></text><text x="40" y="564" font-size="18" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" class="work-title">Medusa</text><text x="40" y="583" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">RESIDUO</text><text x="40" y="608" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">lleno de residuos</text><text x="40" y="629" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">que no son míos</text><text x="40" y="650" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">pero se quedan</text></a></g><g class="work-block"><a href="/codigo/grid-palabras/" aria-label="Grid de Palabras"><text x="1000" y="540" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.1em"><tspan font-family="'Newsreader', Georgia, serif" font-size="12">◊</tspan><tspan dx="6">CÓDIGO</tspan></text><text x="1000" y="564" font-size="18" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" class="work-title">Grid de Palabras</text><text x="1000" y="583" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">MARKOV</text><text x="1000" y="608" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">El archivo se vuelve a escribir:</text><text x="1000" y="629" font-size="15" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">una grilla generada desde el corpus.</text></a><a class="node" href="/rizoma/nodos/#repeticion" aria-label="nodo repetición"><text x="1000" y="662" font-size="11.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="rgba(233,230,220,0.30)">— </tspan>repetición<tspan font-size="8.5" dy="-4" fill="#7f8a88">01</tspan></text></a><a class="node" href="/rizoma/nodos/#redundancia" aria-label="nodo redundancia"><text x="1000" y="679" font-size="11.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="rgba(233,230,220,0.30)">— </tspan>redundancia<tspan font-size="8.5" dy="-4" fill="#7f8a88">01</tspan></text></a><a class="node" href="/rizoma/nodos/#automatizacion" aria-label="nodo automatización"><text x="1000" y="696" font-size="11.5" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace"><tspan fill="rgba(233,230,220,0.30)">— </tspan>automatización<tspan font-size="8.5" dy="-4" fill="#7f8a88">01</tspan></text></a></g><text x="360" y="500" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.12em">CORTE</text><line x1="360" y1="520" x2="544" y2="520" stroke="rgba(233,230,220,0.34)" stroke-width="1"/><line x1="676" y1="520" x2="872" y2="520" stroke="rgba(233,230,220,0.34)" stroke-width="1"/><text x="544" y="552" font-size="13" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" font-style="italic">Deprecar no es borrar.</text><text x="544" y="572" font-size="13" fill="#e9e6dc" font-family="'Newsreader', Georgia, serif" font-style="italic">es conservar algo que ya no se actualiza.</text><rect x="40" y="740" width="268" height="172" fill="none" stroke="rgba(233,230,220,0.16)" stroke-width="1" stroke-dasharray="4 4"/><text x="60" y="768" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.12em">SIN TRAZO</text><text x="60" y="816" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">¿qué parte de nosotros</text><text x="60" y="836" font-size="14" fill="#9aa3a1" font-family="'Newsreader', Georgia, serif" font-style="italic">no entró al archivo?</text></g><line x1="44" y1="984" x2="1236" y2="984" stroke="rgba(233,230,220,0.14)" stroke-width="1"/><text x="44" y="1008" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.05em">Estado del campo al 2026-11-10. No es un resumen.</text><text x="560" y="1008" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.05em">La lámina se fecha y se rehace.</text><text x="1236" y="1008" font-size="11" fill="#7f8a88" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.05em">KNDL · Rizoma · 02</text></svg>
